name: security-scan

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main ]
  schedule:
    - cron: "0 6 * * 1"          # escaneo completo semanal
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

env:
  SEMGREP_VERSION: "1.183.0"
  DC_VERSION: "12.2.2"
  CYCLONEDX_PLUGIN_VERSION: "2.9.2"

jobs:
  sast:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Instalar Semgrep (versión fija)
        run: python -m pip install "semgrep==${SEMGREP_VERSION}"

      - name: Ejecutar Semgrep (SARIF y JSON)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p reports
          EXTRA=""
          if [ -n "$BASE_SHA" ]; then EXTRA="--baseline-commit $BASE_SHA"; fi
          semgrep scan \
            --config p/owasp-top-ten --config p/secrets \
            --config p/java --config p/findsecbugs \
            --config semgrep-rules/ \
            --metrics=off \
            --sarif-output=reports/semgrep.sarif \
            --json-output=reports/semgrep.json \
            $EXTRA \
            proyecto-maven

      - name: Compuerta SAST (falla ante severidad ERROR)
        run: |
          jq -e '[.results[] | select(.extra.severity=="ERROR")] | length == 0' reports/semgrep.json

      - name: Subir reportes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: semgrep-reports
          path: reports/
          if-no-files-found: warn

      - name: Normalizar SARIF (compatibilidad con Code Scanning)
        if: always() && hashFiles('reports/semgrep.sarif') != ''
        run: |
          jq '
            def cut: if type == "string" and length > 255 then .[0:255] else . end;
            del(.runs[].tool.driver.rules[]?.properties["security-severity"])
            | .runs[].tool.driver.rules[]? |= ((.id |= cut) | (if has("name") then .name |= cut else . end))
            | .runs[].results[]? |= (if has("ruleId") then .ruleId |= cut else . end)
          ' reports/semgrep.sarif > reports/semgrep.clean.sarif
          mv reports/semgrep.clean.sarif reports/semgrep.sarif

      - name: Subir SARIF a code scanning
        if: always() && hashFiles('reports/semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4.39.1
        with:
          sarif_file: reports/semgrep.sarif
          category: semgrep

  sca:
    name: SBOM + SCA - Dependency-Check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Generar SBOM CycloneDX
        run: |
          mkdir -p reports
          mvn -B -f proyecto-maven/pom.xml org.cyclonedx:cyclonedx-maven-plugin:${CYCLONEDX_PLUGIN_VERSION}:makeAggregateBom
          cp proyecto-maven/target/bom.json reports/bom.json

      - name: Copiar dependencias para el análisis
        run: mvn -B -f proyecto-maven/pom.xml dependency:copy-dependencies -DoutputDirectory=target/dependency

      - name: Definir umbral de CVSS según la rama
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            echo "FAIL_CVSS=7" >> "$GITHUB_ENV"   # main: bloquea Alta y Crítica
          else
            echo "FAIL_CVSS=9" >> "$GITHUB_ENV"   # PR/develop: bloquea solo Crítica
          fi

      - name: Restaurar caché de la base NVD
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.dependency-check/data
          key: dc-data-${{ runner.os }}-${{ github.run_id }}
          restore-keys: dc-data-${{ runner.os }}-

      - name: Instalar Dependency-Check (versión fija)
        run: |
          curl -sSL --fail -o dc.zip "https://github.com/dependency-check/DependencyCheck/releases/download/v${DC_VERSION}/dependency-check-${DC_VERSION}-release.zip"
          unzip -q dc.zip

      - name: Ejecutar Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          ./dependency-check/bin/dependency-check.sh \
            --project "$GITHUB_REPOSITORY" \
            --scan proyecto-maven/target/dependency \
            --format SARIF --format JSON --format HTML \
            --out reports \
            --data "$HOME/.dependency-check/data" \
            --suppression security/dependency-check-suppressions.xml \
            --failOnCVSS "$FAIL_CVSS" \
            --nvdApiKey "$NVD_API_KEY"

      - name: Guardar caché de la base NVD
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.dependency-check/data
          key: dc-data-${{ runner.os }}-${{ github.run_id }}

      - name: Subir reportes y SBOM
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: sca-reports
          path: reports/
          if-no-files-found: warn

      - name: Subir SARIF a code scanning
        if: always() && hashFiles('reports/dependency-check-report.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4.39.1
        with:
          sarif_file: reports/dependency-check-report.sarif
          category: dependency-check